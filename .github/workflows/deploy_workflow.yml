name: deploy_workflow.yml

on:
  pull_request:
    branches:
      - '**'

jobs:
  test-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show key variables (debug)
        run: |
          echo "HOST: ${{ secrets.SSH_HOST }}"
          echo "USER: ${{ secrets.SSH_USER }}"
          echo "DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}"
          echo "KEY PRESENT: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare remote environment (optional for new servers)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            sudo apt-get update -y
            sudo apt-get install -y docker.io curl
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p $DOCKER_CONFIG/cli-plugins
            curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o $DOCKER_CONFIG/cli-plugins/docker-compose
            chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            sudo usermod -aG docker $USER || true
            sudo mkdir -p ${{ secrets.DEPLOY_PATH }}
            sudo mkdir -p ${{ secrets.BACKUP_PATH }}
            sudo chown -R $USER:$USER ${{ secrets.DEPLOY_PATH }}
            sudo chown -R $USER:$USER ${{ secrets.BACKUP_PATH }}
          EOF

      - name: Backup current images
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            for svc in $(docker compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml config --services); do
              img=$(docker compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml ps -q $svc | xargs docker inspect --format='{{.Config.Image}}')
              echo "$img" > "${{ secrets.BACKUP_PATH }}/${svc}_image_backup"
            done
          EOF

      - name: Copy files to remote server
        run: |
          rsync -az --exclude='.git' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Deploy application (docker-compose)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            docker-compose down --remove-orphans || true
            docker-compose pull || true
            docker-compose up -d --build
          EOF

      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }}:${{ secrets.SERVICE_PORT || '80' }})
          if [ "$STATUS" -ne 200 ]; then
            echo "Initial health check failed with status $STATUS"
            echo "Trying to restart the app once more..."
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
              cd ${{ secrets.DEPLOY_PATH }}
              docker-compose restart
          EOF
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }}:${{ secrets.SERVICE_PORT || '80' }})
            if [ "$STATUS" -ne 200 ]; then
              echo "Retry health check failed with status $STATUS"
              echo "Rollback is commented out during testing."
              # ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
              #   cd ${{ secrets.DEPLOY_PATH }}
              #   docker-compose down || true
              #   for f in ${{ secrets.BACKUP_PATH }}/*_image_backup; do
              #     svc=$(basename $f | sed 's/.image_backup//')
              #     img=$(cat $f)
              #     if [ -n "$img" ]; then
              #       docker pull $img || true
              #       docker tag $img $svc:latest || true
              #     fi
              #   done
              #   docker-compose up -d
              # EOF
              exit 1
            else
              echo "Service recovered after restart. Health check passed with status $STATUS"
            fi
          else
            echo "Health check passed successfully with status $STATUS"
          fi

      - name: Collect container logs
        run: |
          mkdir -p /opt/logs
          for svc in $(ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && docker compose config --services"); do
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && docker compose logs $svc" > /opt/logs/${svc}.log || true
          done

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-service-logs
          path: /opt/logs/
